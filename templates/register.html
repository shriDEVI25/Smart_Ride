<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Smart Ride</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">🚗</div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join Smart Ride today</p>

      <div id="authAlert" class="alert" style="display:none;"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Rahul Sharma" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Min. 6 characters" required />
        </div>
        <div class="form-group">
          <label>I want to</label>
          <div class="role-selector">
            <label class="role-option">
              <input type="radio" name="role" value="rider" required />
              <span class="role-card">
                <span class="role-icon">🧑‍💼</span>
                <span class="role-label">Book Rides</span>
                <span class="role-desc">Rider</span>
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="driver" required />
              <span class="role-card">
                <span class="role-icon">🚗</span>
                <span class="role-label">Drive & Earn</span>
                <span class="role-desc">Driver</span>
              </span>
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>Gender</label>
          <div class="gender-selector">
            <label class="gender-option">
              <input type="radio" name="gender" value="female" required />
              <span class="gender-chip">👩 Female</span>
            </label>
            <label class="gender-option">
              <input type="radio" name="gender" value="male" />
              <span class="gender-chip">👨 Male</span>
            </label>
            <label class="gender-option">
              <input type="radio" name="gender" value="other" />
              <span class="gender-chip">⚧ Other</span>
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Create Account</button>
      </form>

      <p class="auth-link">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
